:root{--blue:#1E4BD2;--red:#E5383B;--rt:#C62428;--navy:#0B1B4D;--soft:#F1F4FB;--line:#D9E0F2;--mut:#4A5578;--grn:#1B7F4B}
*{box-sizing:border-box}
body{margin:0;font:17px/1.5 "Outfit","Helvetica Neue",Arial,sans-serif;color:var(--navy);background:#fff;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header a{display:flex;align-items:center;gap:10px;color:var(--navy);text-decoration:none;font-weight:600}
header svg{width:34px;height:34px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600;cursor:pointer}
.btn:hover{background:#1740B3}
.ghost{background:none;border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500}
.ghost:hover{border-color:var(--blue)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.bar select{flex:1;min-width:140px}
select,input,textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
.bar select{width:auto}
.sum{background:var(--soft);border-radius:18px;padding:20px}
.sum small{color:var(--mut)}
#total{font-size:2.4rem;font-weight:600;letter-spacing:-.02em;line-height:1.1}
ul{list-style:none;margin:0;padding:0}
#wallets li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
#wallets li span{flex:1}
.x{border:0;background:none;color:var(--mut);font-size:1.3rem;cursor:pointer;padding:2px 8px}
.x:hover{color:var(--rt)}
.mut{color:var(--mut)}
.addw{display:flex;gap:8px;margin-top:12px}
.addw input:first-child{flex:2}.addw input:nth-child(2){flex:1}
h2{font-size:1.25rem;margin:30px 0 10px}
.fl{display:flex;gap:8px;margin-bottom:6px}
#hist li{display:flex;gap:10px;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
#hist small{display:block;color:var(--mut)}
.amt{font-weight:600;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.in{color:var(--grn)}.out{color:var(--rt)}
.acts button{border:0;background:none;color:var(--blue);cursor:pointer;padding:2px 0 0;margin-right:10px;font-size:.9rem}
.cta{margin:18px 0}
.empty{text-align:center;padding:50px 0}
.foot{color:var(--mut);font-size:.88rem;margin-top:34px}
dialog{border:0;border-radius:18px;padding:22px;width:min(520px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(11,27,77,.35)}
dialog::backdrop{background:rgba(11,27,77,.45)}
dialog h2{margin:0 0 12px}
label{display:block;margin:10px 0 0;font-weight:500;font-size:.95rem}
label input,label select,label textarea{margin-top:4px;font-weight:400}
.seg{display:flex;gap:6px}
.seg label{flex:1;margin:0;position:relative}
.seg input{position:absolute;opacity:0;width:0}
.seg span{display:block;text-align:center;padding:10px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600}
.seg input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.leg{display:flex;gap:6px;margin-top:6px}
.leg select{flex:2}.leg input{flex:1}
#err{color:var(--rt);min-height:1.4em;margin:8px 0 0}
.row{display:flex;gap:8px;margin-top:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>

<header><a href="index.html"><svg viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="30" fill="#1E4BD2"/><path d="M20 76C16 42 54 38 50 62C47 80 28 76 36 62C42 52 60 56 66 60L86 60" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="99" cy="60" r="10" fill="#E5383B"/></svg>Tracks</a><a href="index.html">Easily Uncomplicated</a></header>

<div id="empty" class="empty" hidden><h1>See where your money goes</h1><p class="mut">Make your first track to start.</p><button class="btn" id="firstTrack">Create a track</button></div>

<main id="app" hidden>
<div class="bar"><label class="mut" for="trackSel" style="margin:0">Track</label><select id="trackSel"></select><button class="ghost" id="newTrack">New track</button><button class="ghost" id="exp">Export CSV</button></div>
<section class="sum" aria-label="Wallets">
<small>Total across all wallets</small><div id="total"></div>
<ul id="wallets"></ul>
<form class="addw" id="addw"><input id="wn" placeholder="New wallet name" required maxlength="30" aria-label="New wallet name"><input id="ws" placeholder="Starting amount" inputmode="decimal" aria-label="Starting amount"><button class="ghost" type="submit">Add</button></form>
</section>
<div class="cta"><button class="btn" id="addE">+ Add entry</button></div>

<ul id="hist"></ul>
<p class="foot">Everything is saved in this browser only. Clearing your browser data deletes it, so export your CSV now and then. <button class="ghost" id="delT" style="margin-left:6px">Delete this track</button></p>

</div>

<dialog id="dlg"><form id="f" novalidate>
<h2 id="dt">Add entry</h2>
<div class="seg" role="radiogroup" aria-label="Entry type"><label><input type="radio" name="ty" value="income"><span>In</span></label><label><input type="radio" name="ty" value="expense" checked><span>Out</span></label><label><input type="radio" name="ty" value="transfer"><span>Move</span></label></div>
<label>What was it<input id="what" maxlength="80" placeholder="e.g. Groceries"></label>
<label id="amtL">Amount<input id="amt" inputmode="decimal" placeholder="0.00"></label>
<label>Date<input id="date" type="date"></label>
<label id="walL">Wallet<select id="wal"></select></label>
<label id="catL">Category<input id="cat" list="cats" maxlength="40" placeholder="e.g. Food"></label><datalist id="cats"></datalist>
<div id="mv"><label>From wallet<select id="from"></select></label>
<div id="legs"></div><button type="button" class="ghost" id="addLeg" style="margin-top:8px">+ Add another wallet</button>
<label>Fee (optional)<input id="fee" inputmode="decimal" placeholder="e.g. 5.00 bank charge"></label></div>
<label>Place or person (optional)<input id="place" maxlength="60"></label>
<label>Note (optional)<textarea id="note" rows="2" maxlength="300"></textarea></label>
<p id="err" role="alert"></p>
<div class="row"><button class="btn" type="submit">Save</button><button type="button" class="ghost" id="cancel">Cancel</button></div>
</form></dialog>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var K='eu.tracks.v1',S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.tracks)S={tracks:[],cur:null};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Could not save. Your browser may be blocking storage.')}}
var uid=function(){return Math.random().toString(36).slice(2,9)};
var T=function(){return S.tracks.filter(function(t){return t.id===S.cur})[0]};
var cents=function(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?Math.round(n*100):NaN};
function money(c,t){return (c<0?'-':'')+((t&&t.cur)||'R')+(Math.abs(c)/100).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}
var sumLegs=function(e){return e.legs.reduce(function(a,l){return a+l.amount},0)};
function bal(t,id){var b=t.wallets.filter(function(w){return w.id===id})[0].start;
t.entries.forEach(function(e){
if(e.type==='income'&&e.wallet===id)b+=e.amount;
else if(e.type==='expense'&&e.wallet===id)b-=e.amount;
else if(e.type==='transfer'){if(e.from===id)b-=sumLegs(e)+(e.fee||0);e.legs.forEach(function(l){if(l.to===id)b+=l.amount})}});
return b}
function wn(t,id){var w=t.wallets.filter(function(x){return x.id===id})[0];return w?w.name:'?'}
function touches(e,id){return e.wallet===id||e.from===id||(e.legs||[]).some(function(l){return l.to===id})}

function render(){
var t=T();
$('#trackSel').innerHTML=S.tracks.map(function(x){return '<option value="'+x.id+'"'+(x.id===S.cur?' selected':'')+'>'+esc(x.name)+'</option>'}).join('');
$('#empty').hidden=!!t;$('#app').hidden=!t;
if(!t)return;
$('#total').textContent=money(t.wallets.reduce(function(a,w){return a+bal(t,w.id)},0),t);
$('#wallets').innerHTML=t.wallets.map(function(w){return '<li><span>'+esc(w.name)+'</span><b>'+money(bal(t,w.id),t)+'</b><button class="x" data-delw="'+w.id+'" aria-label="Delete wallet '+esc(w.name)+'">&times;</button></li>'}).join('')||'<li class="mut">No wallets yet. Add one below.</li>';
var fw=$('#fw'),cur=fw.value;
fw.innerHTML='<option value="">All wallets</option>'+t.wallets.map(function(w){return '<option value="'+w.id+'">'+esc(w.name)+'</option>'}).join('');
fw.value=cur;
var q=$('#q').value.trim().toLowerCase(),wf=fw.value;
var list=t.entries.filter(function(e){
if(wf&&!touches(e,wf))return false;
return !q||[e.what,e.cat,e.place,e.note].join(' ').toLowerCase().indexOf(q)>-1})
.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.ts-a.ts});
$('#hist').innerHTML=list.map(function(e){
var d,a,c;
if(e.type==='transfer'){
d=esc(wn(t,e.from))+' &rarr; '+e.legs.map(function(l){return esc(wn(t,l.to))+' '+money(l.amount,t)}).join(', ')+(e.fee?' (fee '+money(e.fee,t)+')':'');
a=money(sumLegs(e),t);c=''}
else{d=esc(wn(t,e.wallet))+(e.cat?' &middot; '+esc(e.cat):'');a=(e.type==='income'?'+':'-')+money(e.amount,t);c=e.type==='income'?'in':'out'}
return '<li><div><b>'+esc(e.what)+'</b><small>'+esc(e.date)+' &middot; '+d+(e.place?' &middot; '+esc(e.place):'')+'</small>'+(e.note?'<small>'+esc(e.note)+'</small>':'')+'<div class="acts"><button data-edit="'+e.id+'">Edit</button><button data-del="'+e.id+'">Delete</button></div></div><div class="amt '+c+'">'+a+'</div></li>'}).join('')||'<li class="mut">'+(t.entries.length?'Nothing matches.':'No entries yet. Add your first one.')+'</li>'}

/* tracks and wallets */
function newTrack(){
var name=(prompt('Name your track (for example Personal or Holiday)')||'').trim();if(!name)return;
var cur=prompt('Currency symbol','R');if(cur===null)return;
var t={id:uid(),name:name,cur:(cur.trim()||'R'),wallets:[{id:uid(),name:'Main',start:0}],cats:['Food','Transport','Bills','Shopping','Health','Fun','Salary'],entries:[]};
S.tracks.push(t);S.cur=t.id;save();render()}
$('#newTrack').onclick=$('#firstTrack').onclick=newTrack;
$('#trackSel').onchange=function(){S.cur=this.value;save();render()};
$('#delT').onclick=function(){var t=T();if(t&&confirm('Delete the track "'+t.name+'" and everything in it? This cannot be undone.')){S.tracks=S.tracks.filter(function(x){return x.id!==t.id});S.cur=S.tracks.length?S.tracks[0].id:null;save();render()}};
$('#addw').onsubmit=function(ev){ev.preventDefault();var t=T(),s=$('#ws').value.trim(),st=s?cents(s):0;
if(isNaN(st)){alert('The starting amount must be a number.');return}
t.wallets.push({id:uid(),name:$('#wn').value.trim(),start:st});this.reset();save();render()};
$('#wallets').onclick=function(ev){var id=ev.target.getAttribute('data-delw');if(!id)return;var t=T();
if(t.entries.some(function(e){return touches(e,id)})){alert('This wallet has entries. Delete or edit those entries first.');return}
if(confirm('Delete this wallet?')){t.wallets=t.wallets.filter(function(w){return w.id!==id});save();render()}};
$('#q').oninput=$('#fw').onchange=render;

/* entry form */
var editId=null;
var ty=function(){return document.querySelector('input[name=ty]:checked').value};
function wopts(sel){return T().wallets.map(function(w){return '<option value="'+w.id+'"'+(w.id===sel?' selected':'')+'>'+esc(w.name)+'</option>'}).join('')}
function addLeg(to,amt){var d=document.createElement('div');d.className='leg';
d.innerHTML='<select aria-label="Move to wallet">'+wopts(to)+'</select><input inputmode="decimal" placeholder="Amount" aria-label="Amount to move" value="'+esc(amt||'')+'"><button type="button" class="x" aria-label="Remove">&times;</button>';
d.querySelector('button').onclick=function(){d.remove()};$('#legs').appendChild(d)}
function setType(){var v=ty();$('#amtL').hidden=$('#walL').hidden=v==='transfer';$('#catL').hidden=v==='transfer';$('#mv').hidden=v!=='transfer'}
document.querySelectorAll('input[name=ty]').forEach(function(r){r.onchange=setType});
$('#addLeg').onclick=function(){addLeg()};
function openDlg(id){var t=T();
if(!t.wallets.length){alert('Add a wallet first.');return}
editId=id||null;var e=id&&t.entries.filter(function(x){return x.id===id})[0];
$('#dt').textContent=e?'Edit entry':'Add entry';$('#err').textContent='';
$('#wal').innerHTML=wopts(e&&e.wallet);$('#from').innerHTML=wopts(e&&e.from);
$('#cats').innerHTML=t.cats.map(function(c){return '<option value="'+esc(c)+'">'}).join('');
$('#legs').innerHTML='';
document.querySelector('input[name=ty][value='+(e?e.type:'expense')+']').checked=true;
$('#what').value=e?e.what:'';$('#amt').value=e&&e.type!=='transfer'?(e.amount/100).toFixed(2):'';
$('#date').value=e?e.date:new Date().toLocaleDateString('en-CA');
$('#cat').value=(e&&e.cat)||'';$('#place').value=(e&&e.place)||'';$('#note').value=(e&&e.note)||'';
$('#fee').value=e&&e.fee?(e.fee/100).toFixed(2):'';
if(e&&e.type==='transfer')e.legs.forEach(function(l){addLeg(l.to,(l.amount/100).toFixed(2))});else addLeg();
setType();$('#dlg').showModal();$('#what').focus()}
$('#addE').onclick=function(){openDlg()};
$('#cancel').onclick=function(){$('#dlg').close()};
$('#hist').onclick=function(ev){var t=T(),a=ev.target.getAttribute('data-edit'),d=ev.target.getAttribute('data-del');
if(a)openDlg(a);
if(d&&confirm('Delete this entry?')){t.entries=t.entries.filter(function(e){return e.id!==d});save();render()}};
$('#f').onsubmit=function(ev){ev.preventDefault();
var t=T(),v=ty(),err=function(m){$('#err').textContent=m},what=$('#what').value.trim(),date=$('#date').value;
if(!what||!date)return err('Add what it was and the date.');
var e={id:editId||uid(),type:v,what:what,date:date,place:$('#place').value.trim(),note:$('#note').value.trim(),ts:Date.now()};
if(v==='transfer'){
e.from=$('#from').value;
e.legs=[].slice.call(document.querySelectorAll('.leg')).map(function(r){return {to:r.querySelector('select').value,amount:cents(r.querySelector('input').value)}});
if(!e.legs.length||e.legs.some(function(l){return !(l.amount>0)}))return err('Each wallet you move money to needs an amount above zero.');
if(e.legs.some(function(l){return l.to===e.from}))return err('You cannot move money into the wallet it comes from.');
var fe=$('#fee').value.trim();e.fee=fe?cents(fe):0;
if(!(e.fee>=0))return err('The fee must be a number, or leave it empty.');
e.amount=sumLegs(e)}
else{e.wallet=$('#wal').value;e.amount=cents($('#amt').value);e.cat=$('#cat').value.trim();
if(!(e.amount>0))return err('Amount must be a number above zero.');
if(e.cat&&t.cats.indexOf(e.cat)<0)t.cats.push(e.cat)}
if(editId)t.entries=t.entries.map(function(x){return x.id===editId?e:x});else t.entries.push(e);
save();$('#dlg').close();render()};

/* export */
function cell(v,text){v=String(v==null?'':v);if(text&&/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
$('#exp').onclick=function(){var t=T(),a=function(c){return (c/100).toFixed(2)},rows=[['EntryID','Date','Type','What','Amount','Wallet','From','To','Category','Place','Note']];
t.entries.slice().sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:x.ts-y.ts}).forEach(function(e,i){var id=i+1;
if(e.type==='transfer'){e.legs.forEach(function(l){rows.push([id,e.date,'Transfer',e.what,a(l.amount),'',wn(t,e.from),wn(t,l.to),'',e.place,e.note])});
if(e.fee)rows.push([id,e.date,'Fee','Transfer fee',a(e.fee),wn(t,e.from),'','','Bank fees',e.place,e.note])}
else rows.push([id,e.date,e.type==='income'?'Income':'Expense',e.what,a(e.amount),wn(t,e.wallet),'','',e.cat,e.place,e.note])});
var txt='\ufeff'+rows.map(function(r,ri){return r.map(function(c,ci){return cell(c,ri>0&&(ci===3||ci>=8))}).join(',')}).join('\r\n');
var u=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})),l=document.createElement('a');
l.href=u;l.download=t.name.replace(/[^\w\-]+/g,'_')+'-tracks.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)};

if(!T()&&S.tracks.length)S.cur=S.tracks[0].id;
render();
})();
</script>
</body>
</html>
